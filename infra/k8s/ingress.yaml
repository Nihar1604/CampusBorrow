apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campusborrow-ingress
  namespace: campusborrow
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: campusborrow.vit.edu
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: campusborrow-backend-service
                port:
                  number: 5000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: campusborrow-backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campusborrow-frontend-service
                port:
                  number: 80
