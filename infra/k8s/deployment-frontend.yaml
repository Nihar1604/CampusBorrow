apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusborrow-frontend
  namespace: campusborrow
  labels:
    app: campusborrow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campusborrow-frontend
  template:
    metadata:
      labels:
        app: campusborrow-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/campusborrow/campusborrow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
