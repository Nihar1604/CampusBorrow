name: CampusBorrow CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-pipeline:
    name: Lint, Scan, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov bandit

      - name: Code Linting (flake8)
        run: |
          flake8 backend tests --count --max-complexity=10 --max-line-length=120 --show-source --statistics

      - name: Security Static Scan (bandit)
        run: |
          bandit -r backend -ll

      - name: Automated Unit Tests & Coverage (pytest)
        run: |
          pytest --cov=backend --cov-report=term-missing

      - name: Docker Build Verification
        run: |
          docker build -t campusborrow-backend:latest .
