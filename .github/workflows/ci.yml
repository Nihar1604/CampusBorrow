name: CampusBorrow CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest Suite & DevSecOps Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v

  build-and-push:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repo owner
        id: vars
        run: echo "owner_lower=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: env.GHCR_TOKEN != ''
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ steps.vars.outputs.owner_lower }} --password-stdin

      - name: Build Backend Docker Image
        run: docker build -t ghcr.io/${{ steps.vars.outputs.owner_lower }}/campusborrow-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t ghcr.io/${{ steps.vars.outputs.owner_lower }}/campusborrow-frontend:latest ./frontend
